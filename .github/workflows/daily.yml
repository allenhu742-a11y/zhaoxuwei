name: Daily EU price snapshot

on:
  schedule:
    # GitHub 的定时任务在整点最拥挤，常被延迟数小时甚至跳过，所以错开整点并加两次补跑。
    # 当天已有完整快照时，补跑会自动跳过。
    - cron: "17 8 * * *"    # 08:17 UTC = 柏林 09:17（冬令时）
    - cron: "43 12 * * *"   # 补跑 1
    - cron: "29 17 * * *"   # 补跑 2
  workflow_dispatch:
    inputs:
      countries:
        description: "Countries, comma-separated (blank = DE,FR,IT,RO,PL,TR)"
        required: false
      brands:
        description: "Brands, comma-separated (blank = all)"
        required: false

permissions:
  contents: write

concurrency:
  group: price-snapshot
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.p.outputs.date }}
      matrix: ${{ steps.p.outputs.matrix }}
      skip: ${{ steps.p.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          D=$(TZ=Europe/Berlin date +%F)
          echo "date=$D" >> "$GITHUB_OUTPUT"
          C="${{ github.event.inputs.countries }}"; C="${C:-DE,FR,IT,RO,PL,TR}"
          echo "matrix=$(echo "$C" | tr -d ' ' | jq -Rc 'split(",")')" >> "$GITHUB_OUTPUT"
          N=$(ls data/snapshots/$D/*.json 2>/dev/null | wc -l)
          WANT=$(echo "$C" | tr ',' '\n' | grep -c .)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$N" -ge "$WANT" ]; then
            echo "Snapshot for $D already complete ($N countries) - skipping"; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: prep
    if: needs.prep.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        country: ${{ fromJSON(needs.prep.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium && sudo apt-get install -y xvfb
      - name: Scrape ${{ matrix.country }}
        continue-on-error: true
        run: |
          xvfb-run -a python -m scraper.run --country ${{ matrix.country }} --date ${{ needs.prep.outputs.date }} \
            ${{ github.event.inputs.brands && format('--brands "{0}"', github.event.inputs.brands) || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snap-${{ matrix.country }}
          path: |
            data/snapshots/${{ needs.prep.outputs.date }}/${{ matrix.country }}.json
            debug/${{ matrix.country }}/
          if-no-files-found: ignore

  merge:
    needs: [prep, scrape]
    if: always() && needs.prep.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: snap-*
          path: _art
      - name: Place files
        run: |
          D=${{ needs.prep.outputs.date }}
          mkdir -p data/snapshots/$D
          for dir in _art/snap-*; do
            CC=${dir##*snap-}
            f=$(find "$dir" -name "$CC.json" -path "*snapshots*" | head -1)
            [ -n "$f" ] && cp "$f" data/snapshots/$D/$CC.json
            dbg=$(find "$dir" -type d -path "*debug/$CC" | head -1)
            if [ -n "$dbg" ]; then mkdir -p debug/$CC && cp -r "$dbg"/. debug/$CC/; fi
          done
          rm -rf _art
          ls -la data/snapshots/$D
      - name: Build history + dashboard
        run: python -m scraper.build
      - name: Commit
        run: |
          mkdir -p debug
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data docs debug
          git diff --cached --quiet || git commit -m "snapshot ${{ needs.prep.outputs.date }}"
          git pull --rebase --autostash || true
          git push
