name: Daily DE price snapshot

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC = 柏林 10:00（冬令时）/ 11:00（夏令时）
  workflow_dispatch:
    inputs:
      brands:
        description: "Comma-separated brands (blank = all)"
        required: false

permissions:
  contents: write

concurrency:
  group: price-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Scrape
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.brands }}" ]; then
            python -m scraper.run --brands "${{ github.event.inputs.brands }}"
          else
            python -m scraper.run
          fi
      - name: Build history + dashboard
        run: python -m scraper.build
      - name: Commit
        run: |
          mkdir -p debug
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data docs debug
          git diff --cached --quiet || git commit -m "snapshot $(TZ=Europe/Berlin date +%F)"
          git push
